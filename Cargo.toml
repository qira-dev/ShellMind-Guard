[workspace]
resolver = "2"
members = [
    ".",
    "crates/sh-core",
    "crates/sh-graph",
    "crates/sh-sandbox",
    "crates/sh-tui",
    "crates/sh-report",
    "crates/sh-ai",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/qira-dev/ShellMind-Guard"
description = "Deterministic multi-file AST Guard-Set Lattice & Bubblewrap PoC verifier for business-logic, auth, and payment race-condition bugs."

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
petgraph = "0.6"
rayon = "1.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "charset", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.3"
tree-sitter-go = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.24"
tree-sitter-python = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"

[package]
name = "shellmind-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sh-core = { path = "crates/sh-core" }
sh-graph = { path = "crates/sh-graph" }
sh-sandbox = { path = "crates/sh-sandbox" }
sh-tui = { path = "crates/sh-tui" }
sh-report = { path = "crates/sh-report" }
sh-ai = { path = "crates/sh-ai" }

[profile.release]
codegen-units = 16
strip = true
opt-level = 3
