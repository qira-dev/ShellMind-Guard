[workspace]
resolver = "2"
members = [
    ".",
    "crates/smg-core",
    "crates/smg-graph",
    "crates/smg-sandbox",
    "crates/smg-tui",
    "crates/smg-report",
    "crates/smg-ai",
    "crates/smg-hw",
    "crates/smg-web3",
    "crates/smg-pqc",
    "crates/smg-enterprise",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/qira-dev/ShellMind-Guard"
description = "Deterministic multi-file AST Guard-Set Lattice & Bubblewrap PoC verifier for business-logic, auth, and payment race-condition bugs."

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
md-5 = "0.10"
petgraph = "0.6"
rayon = "1.10"
rcgen = "0.13"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "charset", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha1 = "0.10"
sha2 = "0.10"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.3"
tree-sitter-go = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.24"
tree-sitter-python = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"

[package]
name = "shellmind-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
default-run = "smg"

[[bin]]
name = "smg"
path = "src/bin/smg.rs"
test = false

[[bin]]
name = "shellmind-guard"
path = "src/main.rs"
test = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
clap.workspace = true
md-5.workspace = true
rcgen.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha1.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tungstenite.workspace = true
smg-core = { path = "crates/smg-core" }
smg-graph = { path = "crates/smg-graph" }
smg-sandbox = { path = "crates/smg-sandbox" }
smg-tui = { path = "crates/smg-tui" }
smg-report = { path = "crates/smg-report" }
smg-ai = { path = "crates/smg-ai" }
smg-hw = { path = "crates/smg-hw", optional = true }
smg-web3 = { path = "crates/smg-web3", optional = true }
smg-pqc = { path = "crates/smg-pqc", optional = true }
smg-enterprise = { path = "crates/smg-enterprise", optional = true }

[features]
default = ["hw", "web3", "pqc", "enterprise"]
hw = ["dep:smg-hw"]
web3 = ["dep:smg-web3"]
pqc = ["dep:smg-pqc"]
enterprise = ["dep:smg-enterprise"]

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
opt-level = "s"
overflow-checks = true
