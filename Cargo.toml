[workspace]
resolver = "2"
members = [
    ".",
    "crates/vf-core",
    "crates/vf-graph",
    "crates/vf-sandbox",
    "crates/vf-tui",
    "crates/vf-report",
    "crates/vf-ai",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/qira-dev/VeriForge"
description = "Deterministic multi-file AST Guard-Set Lattice & Bubblewrap PoC verifier for business-logic, auth, and payment race-condition bugs."

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
petgraph = "0.6"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"

[package]
name = "veriforge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vf-core = { path = "crates/vf-core" }
vf-graph = { path = "crates/vf-graph" }
vf-sandbox = { path = "crates/vf-sandbox" }
vf-tui = { path = "crates/vf-tui" }
vf-report = { path = "crates/vf-report" }
vf-ai = { path = "crates/vf-ai" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
