name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting (Ubuntu)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Validate installer scripts (Unix)
        if: runner.os != 'Windows'
        run: bash -n install.sh
      - name: Validate PowerShell installer AST (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            throw ($errors | Out-String)
          }
      - name: Check minimal & per-feature builds (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cargo check -p shellmind-guard --all-targets --no-default-features --locked
          cargo test -p shellmind-guard --no-default-features --locked
          cargo check -p shellmind-guard --no-default-features --features hw --locked
          cargo check -p shellmind-guard --no-default-features --features web3 --locked
          cargo check -p shellmind-guard --no-default-features --features pqc --locked
          cargo check -p shellmind-guard --no-default-features --features enterprise --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Workspace Tests
        env:
          SMG_ENFORCE_PRECISION_GATE: "1"
        run: cargo test --workspace --locked
      - name: Self-Scan Dogfood Gate (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -- scan src --ci --format sarif --sarif /tmp/self-src.sarif
          cargo run --locked -- scan crates --ci --format sarif --sarif /tmp/self-crates.sarif
