name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting (Ubuntu)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Check minimal build without default features (Ubuntu)
        if: runner.os == 'Linux'
        run: cargo check -p shellmind-guard --all-targets --no-default-features --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Workspace Tests
        env:
          SMG_ENFORCE_PRECISION_GATE: "1"
        run: cargo test --workspace --locked
      - name: Self-Scan Dogfood Gate (Ubuntu)
        if: runner.os == 'Linux'
        run: cargo run --locked -- scan crates --ci --format sarif --sarif /tmp/self.sarif
