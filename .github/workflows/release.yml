name: Release ShellMind Guard

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Tag Parity & Workspace Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Git Tag Matches Cargo.toml & Plugin Manifest Versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          CARGO_VER="$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)"
          PLUGIN_VER="$(awk -F'"' '/"version":/ {print $4; exit}' .claude-plugin/plugin.json)"
          MARKET_VER="$(awk -F'"' '/"version":/ {print $4; exit}' .claude-plugin/marketplace.json)"
          if [[ "${TAG_VER}" != "${CARGO_VER}" || "${TAG_VER}" != "${PLUGIN_VER}" || "${TAG_VER}" != "${MARKET_VER}" ]]; then
            echo "Version mismatch across tag (v${TAG_VER}), Cargo.toml (${CARGO_VER}), plugin.json (${PLUGIN_VER}), marketplace.json (${MARKET_VER})" >&2
            exit 1
          fi
          bash -n install.sh

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Run Clippy & Workspace Tests
        env:
          SMG_ENFORCE_PRECISION_GATE: "1"
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: shellmind-guard-linux-x86_64.tar.gz
            bin: shellmind-guard
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: shellmind-guard-linux-aarch64.tar.gz
            bin: shellmind-guard
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: shellmind-guard-macos-x86_64.tar.gz
            bin: shellmind-guard
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: shellmind-guard-macos-aarch64.tar.gz
            bin: shellmind-guard
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: shellmind-guard-windows-x86_64.zip
            bin: shellmind-guard.exe

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/smg" "dist/smg"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          chmod +x "dist/smg" "dist/${{ matrix.bin }}"
          tar -czf "${{ matrix.artifact }}" -C dist smg "${{ matrix.bin }}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\smg.exe" "dist\smg.exe"
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.bin }}" "dist\${{ matrix.bin }}"
          Compress-Archive -Path "dist\smg.exe","dist\${{ matrix.bin }}" -DestinationPath "${{ matrix.artifact }}" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum shellmind-guard-* > SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/shellmind-guard-*
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/shellmind-guard-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
