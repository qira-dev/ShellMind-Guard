name: Release ShellMind Guard

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: shellmind-guard-linux-x86_64.tar.gz
            bin: shellmind-guard
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: shellmind-guard-linux-aarch64.tar.gz
            bin: shellmind-guard
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: shellmind-guard-macos-x86_64.tar.gz
            bin: shellmind-guard
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: shellmind-guard-macos-aarch64.tar.gz
            bin: shellmind-guard
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: shellmind-guard-windows-x86_64.zip
            bin: shellmind-guard.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          chmod +x "dist/${{ matrix.bin }}"
          tar -czf "${{ matrix.artifact }}" -C dist "${{ matrix.bin }}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.bin }}" "dist\${{ matrix.bin }}"
          Compress-Archive -Path "dist\${{ matrix.bin }}" -DestinationPath "${{ matrix.artifact }}" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum shellmind-guard-* > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/shellmind-guard-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
